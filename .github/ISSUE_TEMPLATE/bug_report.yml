name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal deterministic steps, inputs, seed, and command.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Revision or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Logs or artifacts
      description: Remove private data and credentials before attaching anything.
