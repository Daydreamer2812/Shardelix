name: Generate actual Shardelix showcase
on:
  push:
    branches: [main]
    paths:
      - 'scripts/make_photo_showcase.py'
      - '.github/workflows/showcase.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . scikit-image==0.25.2
      - run: python scripts/build_native.py
      - run: python scripts/make_photo_showcase.py
      - name: Publish measured visual evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/assets/shardelix-photo-showcase.webp reports/v13/photo-showcase.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish measured Shardelix photographic reconstruction"
            git push origin HEAD:main
          fi
